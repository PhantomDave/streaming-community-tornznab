services:
  sctorznab:
    build: .
    container_name: sctorznab
    ports:
      - "9118:9118"
    env_file:
      - .env
    environment:
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
    volumes:
      - ./data:/data
    restart: unless-stopped
    depends_on:
      - flaresolverr

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
    ports:
      - "8191:8191"
    restart: unless-stopped
