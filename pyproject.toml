[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sctorznab"
version = "0.1.0"
description = "StreamingCommunity Torznab + qBittorrent bridge"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "streaming-community-tornznab contributors" }]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9",
  "yt-dlp",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
